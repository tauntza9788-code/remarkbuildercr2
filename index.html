<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="stylesheet" href="_ds/industry-3350cf33-3c10-4e04-8804-8aaf25c2cd07/styles.css">
<script src="_ds/industry-3350cf33-3c10-4e04-8804-8aaf25c2cd07/_ds_bundle.js"></script>
<style>body{margin:0}</style>
</helmet>
<div style="max-width:430px;margin:0 auto;min-height:100vh;background:var(--color-bg);font-family:var(--font-body);padding-bottom:36px">

  <div style="padding:22px 18px 2px">
    <div style="font-family:var(--font-heading);font-weight:600;font-size:27px;letter-spacing:-0.02em;color:var(--color-text)">CR2 Remark Builder</div>
    <div style="font-size:13px;color:var(--color-text);opacity:.55;margin-top:2px">Tap chips, copy the line, paste anywhere.</div>
  </div>

  <div style="position:sticky;top:0;z-index:10;background:var(--color-bg);padding:14px 18px 10px">
    <div class="blueprint" style="padding:16px 16px 14px">
      <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
      <div style="font-family:var(--font-heading);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-700);margin-bottom:8px">Remark line</div>
      <div style="{{ lineStyle }}">{{ lineText }}</div>
      <div style="display:flex;gap:8px;margin-top:14px">
        <button class="btn btn-primary btn-block" style="margin-top:0;flex:1" onClick="{{ onCopy }}">{{ copyLabel }}</button>
        <button class="btn btn-secondary" onClick="{{ onClear }}">Clear</button>
      </div>
    </div>
  </div>

  <div style="padding:6px 18px 0;display:flex;flex-direction:column;gap:26px">
    <sc-for list="{{ groups }}" as="group" hint-placeholder-count="6">
      <section>
        <h2 style="display:flex;align-items:baseline;gap:8px;font-size:12.5px;color:var(--color-text);opacity:.65;text-transform:uppercase;letter-spacing:.07em;margin:0 0 10px">
          <span style="font-family:var(--font-heading);font-weight:700;color:var(--color-accent-700);opacity:1">{{ group.n }}</span>{{ group.label }}
        </h2>
        <div style="display:flex;flex-wrap:wrap;gap:8px">
          <sc-for list="{{ group.items }}" as="item" hint-placeholder-count="6">
            <button style="{{ item.style }}" style-hover="{{ item.hoverStyle }}" onClick="{{ item.onClick }}">{{ item.value }}</button>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </div>

  <div style="padding:26px 18px 0;font-size:12px;color:var(--color-text);opacity:.5;line-height:1.6">
    Tap a selected choice again to remove it. Only what's picked goes into the line.
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:430,&quot;height&quot;:900}}">
class Component extends DCLogic {
  state = { picked: {}, copied: false };

  groupDefs = [
    { key: 'sale', n: 1, label: 'Sale', items: ['S:Folk','S:Jack','S:Fah','S:Sab','S:Ploy','S:Mud','S:NF'] },
    { key: 'etax', n: 2, label: 'E-tax', items: ['No E-tax','E-tax'] },
    { key: 'discount', n: 3, label: 'Discount type', items: ['New CX-10%','Extended Warranty -15%','No Discount','-10% new member'] },
    { key: 'power', n: 4, label: 'Remark', items: ['Customer prefer this power for clear','Customer prefer this power for comfortable'] },
    { key: 'fop', n: 5, label: 'FOP by', items: ['Folk','Jack','Fah','Sab','Ploy','Mud','NF'] },
    { key: 'recheck', n: 6, label: 'Recheck by', items: ['Folk','Jack','Fah','Sab','Ploy','Mud','NF'] }
  ];

  select(key, value) {
    this.setState(s => {
      const picked = { ...s.picked };
      picked[key] = picked[key] === value ? null : value;
      return { picked, copied: false };
    });
  }

  clear() {
    this.setState({ picked: {}, copied: false });
  }

  buildText() {
    const p = this.state.picked;
    const parts = [];
    if (p.sale) parts.push(p.sale);
    if (p.etax) parts.push(p.etax);
    if (p.discount) parts.push(p.discount);
    if (p.power) parts.push(p.power);
    if (p.fop) parts.push('FOP by ' + p.fop);
    if (p.recheck) parts.push('Recheck by ' + p.recheck);
    return parts.join(' / ');
  }

  copy() {
    const t = this.buildText();
    const finish = (state) => {
      this.setState({ copied: state });
      setTimeout(() => this.setState({ copied: false }), 1400);
    };
    if (!t) { finish('empty'); return; }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(t).then(() => finish(true), () => finish(true));
    } else {
      try {
        const ta = document.createElement('textarea');
        ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      } catch (e) {}
      finish(true);
    }
  }

  chipStyle(selected) {
    const border = selected ? 'var(--color-accent)' : 'var(--color-divider)';
    const bg = selected ? 'var(--color-accent)' : 'transparent';
    const color = selected ? 'var(--color-bg)' : 'var(--color-text)';
    return `font-family:var(--font-body);font-size:14px;padding:10px 14px;min-height:40px;border-radius:0;border:1px solid ${border};background:${bg};color:${color};cursor:pointer;transition:background .15s ease,border-color .15s ease`;
  }

  hoverStyleFor(selected) {
    if (selected) return 'background:var(--color-accent-700);border-color:var(--color-accent-700);color:var(--color-bg)';
    return 'background:var(--color-accent-100);border-color:var(--color-accent);color:var(--color-text)';
  }

  renderVals() {
    const picked = this.state.picked;
    const groups = this.groupDefs.map(g => ({
      key: g.key, n: g.n, label: g.label,
      items: g.items.map(v => {
        const selected = picked[g.key] === v;
        return { value: v, style: this.chipStyle(selected), hoverStyle: this.hoverStyleFor(selected), onClick: () => this.select(g.key, v) };
      })
    }));
    const text = this.buildText();
    const hasText = !!text;
    const lineText = hasText ? text : 'Tap the choices below to build your line.';
    const lineStyle = `font-size:${hasText ? 19 : 15}px;line-height:1.4;color:${hasText ? 'var(--color-text)' : 'var(--color-accent-700)'};font-weight:${hasText ? 600 : 400};min-height:26px;word-break:break-word`;
    let copyLabel = 'Copy line';
    if (this.state.copied === true) copyLabel = 'Copied';
    if (this.state.copied === 'empty') copyLabel = 'Nothing picked yet';
    return {
      groups, lineText, lineStyle, copyLabel,
      onCopy: () => this.copy(),
      onClear: () => this.clear()
    };
  }
}

</script>
</body>
</html>
